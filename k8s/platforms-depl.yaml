apiVersion: apps/v1
kind: Deployment
metadata:
    name: platforms-depl
spec:
    replicas: 1
    selector:
        matchLabels:
            app: platforms-service
    template:
        metadata:
            labels:
                app: platforms-service
        spec:
            containers:
                -   name: platforms-service
                    image: dyrxx/platforms-service
---
apiVersion: v1
kind: Service
metadata:
    name: platforms-cluster-ip-srv
spec:
    type: ClusterIP
    selector:
        app: platforms-service
    ports:
        -   name: platforms-service
            port: 8080
            protocol: TCP
            targetPort: 8080
    