syntax = "proto3";

option csharp_namespace = "MicroServicesDemo.PlatformsService.Shared.Protos";

message PlatformProto {
    string platform_id = 1;
    string name = 2;
    string publisher = 3;
}

message GetAllRequest {}

message GetAllReply {
    PlatformProto platform = 1;
}

service PlatformGrpcService {
    rpc GetAll (GetAllRequest) returns (stream GetAllReply);
}